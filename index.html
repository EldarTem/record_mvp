<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff9a62" />
    <meta name="description" content="Запись и управление очередью" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Очередь" />

    <link rel="icon" type="image/svg+xml" href="/favicon_myTurn.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>Моя очередь</title>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ff9a62;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(
          145deg,
          #ffb07a 0%,
          #ff9a62 45%,
          #ff7a45 100%
        );
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }

      #app-splash.is-hiding {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #app-splash__bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      #app-splash__brand {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: splash-in 0.7s ease both;
      }

      #app-splash__logo {
        height: 44px;
        width: auto;
        display: block;
        filter: drop-shadow(0 8px 24px rgba(120, 40, 10, 0.18));
      }

      #app-splash__pulse {
        width: 36px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        overflow: hidden;
        position: relative;
      }

      #app-splash__pulse::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #fff;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes splash-pulse {
        0% {
          transform: translateX(-20%);
          opacity: 0.5;
        }
        50% {
          transform: translateX(160%);
          opacity: 1;
        }
        100% {
          transform: translateX(280%);
          opacity: 0.5;
        }
      }

      @media (max-width: 768px) {
        #app-splash__logo {
          height: 36px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <svg
        id="app-splash__bg"
        viewBox="0 0 1440 900"
        preserveAspectRatio="xMidYMid slice"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="splash-sand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffb07a" />
            <stop offset="45%" stop-color="#ff9a62" />
            <stop offset="100%" stop-color="#ff7a45" />
          </linearGradient>
        </defs>
        <rect width="1440" height="900" fill="url(#splash-sand)" />
        <path
          d="M0 180 C220 120 380 240 560 200 C780 150 920 80 1140 130 C1280 165 1360 210 1440 190 L1440 0 L0 0 Z"
          fill="#ffc39a"
          opacity="0.55"
        />
        <path
          d="M0 320 C180 280 340 360 520 330 C740 290 900 230 1120 270 C1280 300 1360 340 1440 320 L1440 0 L0 0 Z"
          fill="#ffb488"
          opacity="0.35"
        />
        <path
          d="M0 520 C240 460 420 580 640 540 C880 490 1040 430 1260 480 C1350 505 1400 530 1440 520 L1440 900 L0 900 Z"
          fill="#ff8f55"
          opacity="0.45"
        />
        <path
          d="M0 680 C200 640 360 720 560 700 C820 670 1000 620 1220 660 C1330 680 1390 710 1440 700 L1440 900 L0 900 Z"
          fill="#ff7d42"
          opacity="0.5"
        />
        <path
          d="M0 780 C180 760 320 820 520 800 C780 770 980 740 1200 780 C1320 800 1385 820 1440 810 L1440 900 L0 900 Z"
          fill="#ff6d35"
          opacity="0.55"
        />
      </svg>

      <div id="app-splash__brand">
        <img
          id="app-splash__logo"
          src="/logoWhite.svg"
          alt="очередь"
          width="180"
          height="44"
        />
        <div id="app-splash__pulse"></div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
